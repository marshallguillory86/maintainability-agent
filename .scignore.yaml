# Acknowledged secure-code-agent findings, with the reason each was reviewed
# and the date the acknowledgement expires. Per secure-code-agent design.md §10.

# Scoped by `paths:`, repository-relative. secure-code-agent 0.12.1 and earlier
# matched these globs against absolute paths, so an audit that named the
# repository by absolute path — as maintainability-agent always does — left
# every entry unmatched and its findings live. 3.7.4 worked around that with
# `file:`; secure-code-agent 0.12.2 fixed it (its D20), and this audit refuses
# to run anything older.
- rule_id: gitleaks.curl-auth-user
  paths: [".github/workflows/sonar-rename-main-branch.yml"]
  reason: >-
    Reviewed: git history only. The workflow was deleted in a59c8e7, and every
    match is `curl -u "$SONAR_TOKEN:"`, a shell expansion of a GitHub Actions
    secret, not a literal credential. The rule matches the `-u` argument shape
    and cannot tell a variable from a value. Nothing is in the tree to rotate,
    and rewriting published history to drop a variable reference would break
    every signed commit after it. The live instance in quality-gates.yml was
    changed to a bearer header rather than acknowledged.
  expires: "2027-09-01"

- rule_id: CKV_GHA_7
  paths: [".github/workflows/sonar-resolve.yml"]
  reason: >-
    Reviewed: the rule forbids workflow_dispatch inputs because they can steer
    build output. This workflow builds nothing and publishes no artifact: it
    is a manual, maintainer-only action that records a justification and
    resolves one SonarCloud issue. Its inputs reach the script only through
    environment variables, never interpolated into `run:` (the injection D43
    closed), and the job holds `contents: read`. Removing the inputs removes
    the justification the workflow exists to make mandatory.
  expires: "2027-09-01"

- rule_id: B105
  paths: ["src/maintainability_audit/_masking.py"]
  reason: >-
    Reviewed: all four matches are the word "token" meaning a lexical token.
    B105 fires on an identifier whose name looks credential-shaped, and this
    module is a JavaScript tokenizer: `_STRING_TOKEN` and `_REGEX_TOKEN` are
    regex source, and lines 103 and 105 compare a `token` variable against
    "//" and "/*" — the comment delimiters it just matched. No credential is
    involved and none of these values leaves the module. Not a declared
    capability: a project cannot declare "my variables are called token", and
    B105 belongs to no capability precisely because it is a name heuristic
    rather than an architectural shape.
  expires: "2027-09-01"
