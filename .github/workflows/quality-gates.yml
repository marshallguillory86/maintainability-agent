name: Quality Gates

# Two jobs, both required for merge to main:
#
#   verify — correctness. Lint, dependency CVEs, tests, coverage.
#   audit  — the two deterministic agents, plus their remediation prompts.
#
# The design constraint is "no nit loops". Only **hard gates** can fail a
# build: file/function/duplication failures for maintainability, tripped
# security gates for secure-code. Warnings, letter grades, scores and the
# SonarQube cross-check are advisory — they inform review, they never
# block a merge. A pipeline that fails on a warning teaches people to
# ignore it, and then it protects nothing.
#
# Findings do not die in a log. They go three places a human actually
# looks: the Security tab (SARIF), a single updated PR comment, and a
# bounded remediation prompt artifact you can hand straight to an agent.

on:
  pull_request:
  # Every branch, not just the default one. An audit observed that a
  # pushed feature branch with no open PR ran no checks at all, so the
  # tool's own gate went unenforced on exactly the commits under review.
  push:
  # History-derived signals — churn hotspots, change coupling, ownership
  # concentration — cannot be computed from a diff. They need a window of
  # commits, so a repository that only ever audits changed files never
  # exercises a third of the rubric. This run is the one that does.
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write   # SARIF -> code scanning
  pull-requests: write     # the single updated PR comment

env:
  PYTHON_VERSION: "3.12"

jobs:
  verify:
    name: Verify (lint, deps, tests, coverage)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # SonarQube Cloud needs full history for new-code metrics, and
          # the maintainability audit needs it for the history aspects.
          # At the default depth of 1 those are unmeasured, which costs
          # roughly a grade and withholds a verified grade entirely.
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Upgrade pip itself (fixes CVE-2026-6357 in pip 26.0.1)
        run: python3 -m pip install --upgrade pip
      - name: Install tool with dev extras
        run: python3 -m pip install -e ".[dev]"
      - name: Install the pinned analyzer pool
        # Deliberately NOT a dev extra. ADR 006 makes analyzers runtime
        # prerequisites the user supplies, never package dependencies,
        # so CI supplies them the same way a user would -- installed
        # into the environment, discovered on PATH.
        #
        # Without this the adapters ship unexercised: 44 of the suite's
        # skips were "<tool> is not installed", so the 15 hand-written
        # adapters were covered only by their unit tests and never by an
        # actual invocation.
        #
        # These are the PR gates, so they must satisfy P1's condition:
        # same tree, config, history and pinned analyzer versions in,
        # same result out. The scheduled drift job below keeps the old
        # "analyzer moved" signal, but the gates themselves pin.
        run: >
          python3 -m pip install
          --constraint constraints/analyzers.txt
          cohesion complexipy flake8 interrogate lizard multimetric
          mypy pydocstyle pylint radon ruff vulture
      - name: Lint (ruff)
        run: ruff check src tests tools
      - name: Dependency CVE scan (pip-audit)
        # CVE-2026-3219 against pip has no upstream fix as of 2026-05-09.
        # When one ships, drop the --ignore-vuln. Tracked at
        # https://github.com/pypa/pip/security/advisories
        run: pip-audit --ignore-vuln CVE-2026-3219
      - name: Tests + coverage
        run: |
          python3 -m pytest \
            --cov=maintainability_audit \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --cov-fail-under=92
      - name: Upload coverage
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: coverage
          path: coverage.xml
      - name: SonarQube Cloud scan
        # Advisory cross-check, never a gate. This project's rules are "no
        # cloud service requirement" and "no vendor lock-in", so an expired
        # token or a moved project must not block a PR whose deterministic
        # checks all pass. A red mark here means "go look at the token".
        #
        # This comment used to read "main only, because the plan on this
        # private project covers the main branch alone". Both halves were
        # false. The repository is public and has been since 2026-05-09,
        # and SonarCloud is free and unlimited for public projects,
        # pull request analysis included.
        #
        # The symptom was real: "Not analyzed", and a quality gate the
        # app built from no data. The cause was that SonarCloud's main
        # branch was named `master`, which has never existed here, while
        # `main` sat alongside it as a *short-lived* branch merging into
        # it. So every scan of the real default branch was filed as a
        # feature branch off a main branch that had never been analyzed,
        # leaving pull requests with no baseline to diff against.
        #
        # Renamed 2026-08-26. Runs on pull requests again, where a
        # cross-check is worth something — still advisory, still
        # `continue-on-error`, because this project's rules are "no cloud
        # service requirement" and "no vendor lock-in": an expired token
        # must never block a PR whose deterministic checks all pass.
        #
        # **Pull requests and main, nothing else.** Re-enabling PR
        # analysis removed the condition entirely rather than narrowing
        # it, so every push to a feature branch ran a *second* scan that
        # treated the branch as long-lived. That analysis has no
        # meaningful new-code baseline, fails its quality gate, and the
        # SonarCloud app posts the failure as a commit status — a red
        # mark on every push that means nothing, which is the thing this
        # file's header warns teaches people to ignore the signal.
        if: >
          github.event_name == 'pull_request' ||
          (github.event_name == 'push' && github.ref == 'refs/heads/main')
        continue-on-error: true
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8
        with:
          # Wait for the server-side gate and print which condition
          # failed. Without this the action submits the analysis and
          # exits, SonarCloud computes the gate afterwards, and its app
          # posts a bare red status with no description and no link —
          # unreadable from CI, and unreadable by anyone without the
          # token, which is how it cost half an hour twice today.
          # `continue-on-error` above still keeps the job green: the
          # point is a legible log line, not a new gate.
          args: -Dsonar.qualitygate.wait=true

      # `qualitygate.wait` prints FAILED and a dashboard link, and stops
      # there. The link is useless to anyone without access, and the
      # dashboard is the only place the *conditions* live -- so a red
      # gate stayed "go and look" rather than "coverage on new code is
      # 61%". This asks the server which conditions it failed on and
      # prints them, so the log answers the question the log raises.
      #
      # The token is the same one the scan uses; SonarCloud takes it as
      # the basic-auth username with an empty password.
      - name: Name the failing quality-gate conditions
        if: >
          always() && (github.event_name == 'pull_request' ||
          (github.event_name == 'push' && github.ref == 'refs/heads/main'))
        continue-on-error: true
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -uo pipefail
          key=marshallguillory86_maintainability-agent
          if [ -n "${PR:-}" ]; then scope="pullRequest=$PR"; else scope="branch=main"; fi
          status=$(curl -sS -u "$SONAR_TOKEN:" \
            "https://sonarcloud.io/api/qualitygates/project_status?projectKey=$key&$scope")
          echo "$status" | python3 -c '
          import json, sys
          body = json.load(sys.stdin)
          if "errors" in body:
              print("could not read the gate:", body["errors"])
              raise SystemExit(0)
          st = body["projectStatus"]
          print("quality gate:", st["status"])
          for c in st.get("conditions", []):
              if c["status"] == "OK":
                  continue
              print("  FAILED %s: actual=%s %s threshold=%s" % (
                  c.get("metricKey", c.get("metric", "?")),
                  c.get("actualValue", "none"),
                  c.get("comparator", "?"), c.get("errorThreshold", "?")))
          '

  # `pyproject` declares `Operating System :: POSIX`, and until this job
  # existed the only evidence behind that claim was one Linux image. An
  # audit put it plainly: the platform test forbade `windows` in
  # `runs-on` and called that a demonstration, so macOS was claimed and
  # never once run (D63, reopened).
  #
  # Tests only. Coverage thresholds, pip-audit and Sonar are properties
  # of the project rather than of the platform, and running them twice
  # buys nothing but a second thing to keep green. What this job answers
  # is the one question the Linux runner cannot: does the product work
  # on the other POSIX this package claims.
  verify-macos:
    name: Verify on macOS (tests)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Upgrade pip itself (fixes CVE-2026-6357 in pip 26.0.1)
        run: python3 -m pip install --upgrade pip
      - name: Install tool with dev extras
        run: python3 -m pip install -e ".[dev]"
      - name: Tests
        run: python3 -m pytest -q

  # Run by hand to produce the file `constraints/analyzers.txt` should
  # be. The pool has to be resolved on the platform it constrains, and
  # the only Linux this project can reach is a runner -- which is also
  # why D89 could not be closed by the agent that found it: closing it
  # means installing the pool.
  #
  # Download the artifact, check it in, drop the xfail in
  # `test_the_constraints_were_resolved_on_the_platform_the_gates_run_on`.
  resolve-constraints:
    name: Resolve the analyzer pool on Linux (manual)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Resolve and record
        run: |
          python3 -m venv /tmp/resolve
          /tmp/resolve/bin/python -m pip install --upgrade pip
          /tmp/resolve/bin/python -m pip install \
            cohesion complexipy flake8 interrogate lizard multimetric \
            mypy pydocstyle pylint radon ruff vulture
          {
            printf '# Resolved on %s with Python %s on %s.\n' \
              "$(date -u +%Y-%m-%d)" \
              "$(/tmp/resolve/bin/python -c 'import platform; print(platform.python_version())')" \
              "$(/tmp/resolve/bin/python -c 'import platform; print(platform.platform())')"
            printf '# Produced by the resolve-constraints job in quality-gates.yml.\n'
            printf '# Full dependency closure: a transitive change can move analyzer\n'
            printf '# output while the top-level version stays put.\n'
            /tmp/resolve/bin/python -m pip freeze --all | grep -v '^pip=='
          } > analyzers.txt
          cat analyzers.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: analyzers-constraints-linux
          path: analyzers.txt

  # Every falsifier a new register entry cites has to fail without the
  # change it claims to defend. That was the author's word until now,
  # recorded in a `*Mutation:*` line and believed.
  #
  # Miles Parker named the hole: an agent controls both the code and its
  # test, so one that introduced a bug and adjusted the check to cover
  # it looks identical from outside to one that got it right. The benign
  # version is commonplace — a test fails, the author decides the test
  # was wrong, and edits it. Sometimes that is correct, and nothing
  # external could tell. This is the check that can tell.
  prove-falsifiers:
    name: Falsifiers fail without their fix
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install tool with dev extras
        run: python3 -m pip install -e ".[dev]"
      - name: Prove each newly cited falsifier
        run: python3 tools/prove_falsifiers.py --base "origin/${{ github.base_ref }}"

  declared-authorship:
    name: Every commit declares who wrote it
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Each commit carries an Agent trailer
        # Every agent in this project commits under Marshall's git
        # identity, so `git log` cannot say who did the work. D100 is
        # what that costs: the version was promoted to a 1.0 release
        # candidate and the record could not name who decided it.
        #
        # The trailer is a declaration, not a proof -- a commit naming
        # the wrong agent passes this check. Proof needs per-agent
        # signing keys and required_signatures on the branch. RULES.md
        # says so rather than letting this read as more than it is.
        run: |
          set -euo pipefail
          range="origin/${{ github.base_ref }}..HEAD"
          commits=$(git rev-list --no-merges "$range")
          if [ -z "$commits" ]; then
            echo "no non-merge commits in $range; this check proved nothing"
            exit 1
          fi
          failed=0
          for sha in $commits; do
            agent=$(git show -s --format='%(trailers:key=Agent,valueonly)' "$sha" | tr -d '[:space:]')
            case "$agent" in
              claude|codex|grok|marshall)
                echo "ok    $sha  Agent: $agent" ;;
              "")
                echo "FAIL  $sha  no Agent: trailer"; failed=1 ;;
              *)
                echo "FAIL  $sha  unknown Agent: $agent"; failed=1 ;;
            esac
          done
          exit $failed
      - name: Each commit carries the personal identity, never the work one
        # Marshall holds two accounts: personal (this repo's identity) and
        # work, `mguillory@agilerising.com`. RULES.md, 2026-08-29, in his
        # words: the work address never signs anything here and is never
        # attached to this work unless he explicitly asks for it.
        #
        # This is the lint for a class that already cost real money. 37
        # commits carried the work address between 2026-08-25 and -27
        # because nothing checked; `~/.gitconfig` held it, a repo-local
        # override had been masking it, and when the override stopped
        # applying the commits fell through to the global value silently.
        # Removing them took a history rewrite, a force-push through two
        # layers of branch protection, and a support ticket for the
        # objects GitHub retains after a force-push.
        #
        # It lives as a step in this already-required job rather than as
        # its own job on purpose: a new job name is not in the branch's
        # required-checks list until someone adds it there, so it would
        # sit un-enforced. This inherits enforcement the day it merges.
        #
        # Author *and* committer, because a rebase or an amend rewrites
        # one and not the other.
        run: |
          set -euo pipefail
          allowed="152444602+marshallguillory86@users.noreply.github.com"
          range="origin/${{ github.base_ref }}..HEAD"
          commits=$(git rev-list --no-merges "$range")
          if [ -z "$commits" ]; then
            echo "no non-merge commits in $range; this check proved nothing"
            exit 1
          fi
          failed=0
          for sha in $commits; do
            for role in author:%ae committer:%ce; do
              addr=$(git show -s --format="${role#*:}" "$sha")
              if [ "$addr" = "$allowed" ]; then
                echo "ok    $sha  ${role%%:*}: $addr"
              else
                echo "FAIL  $sha  ${role%%:*}: $addr"
                failed=1
              fi
            done
          done
          if [ "$failed" != "0" ]; then
            cat >&2 <<EOF

          Commit identity is not the personal GitHub noreply address.

          Expected: $allowed

          Fix the machine, then rewrite the range -- a wrong address is
          not fixable after it reaches a protected branch without a
          force-push. See docs/machine-setup.md section 1.

              git config --global user.email "$allowed"
              git config --global user.name  "Marshall Guillory"
              git rebase --exec 'git commit --amend --no-edit --reset-author -S' \\
                  origin/${{ github.base_ref }}

          If this is mguillory@agilerising.com, it is forbidden here by
          RULES.md and no exception applies unless Marshall asked for it
          in that specific instance.
          EOF
            exit 1
          fi
      - name: Each commit is signed, so its Agent trailer is attested
        # This is what upgrades the trailer above from a declaration to
        # an attestation, and it is the whole reason the trailer check
        # is worth running.
        #
        # A signature is computed over the entire commit object -- tree,
        # parents, author, committer, and the full message including
        # trailers. So `Agent: claude` is not a loose string sitting
        # beside the signature; it is inside what was signed. Rewrite it
        # to `Agent: grok` after the fact and the signature goes bad:
        # `%G?` returns B. Proven, not assumed -- forging that exact
        # trailer under the original signature yields B.
        #
        # Verification runs against `.github/allowed_signers`, checked
        # into the repo, so the trusted set changes only by reviewed
        # pull request rather than by whatever sits on a runner.
        #
        # What this establishes: nobody altered the agent attribution
        # after signing, and a key on the allow-list -- which requires a
        # human to authorise its use -- stood behind it. What it does
        # NOT establish: that the attestation was truthful. Every agent
        # on a machine shares that machine's key, so a commit naming the
        # wrong agent still passes. RULES.md states that limit; do not
        # let this comment upgrade it to "provable".
        run: |
          set -euo pipefail
          git config gpg.ssh.allowedSignersFile .github/allowed_signers
          range="origin/${{ github.base_ref }}..HEAD"
          commits=$(git rev-list --no-merges "$range")
          if [ -z "$commits" ]; then
            echo "no non-merge commits in $range; this check proved nothing"
            exit 1
          fi
          failed=0
          for sha in $commits; do
            state=$(git log -1 --format='%G?' "$sha")
            key=$(git log -1 --format='%GK' "$sha")
            agent=$(git show -s --format='%(trailers:key=Agent,valueonly)' "$sha" | tr -d '[:space:]')
            case "$state" in
              G) echo "ok    $sha  signed by $key  Agent: $agent" ;;
              B) echo "FAIL  $sha  BAD signature -- the commit was altered after signing"; failed=1 ;;
              N) echo "FAIL  $sha  unsigned"; failed=1 ;;
              U|X|Y|R|E)
                 echo "FAIL  $sha  signature state '$state' (key not in .github/allowed_signers?)"
                 failed=1 ;;
              *) echo "FAIL  $sha  unknown signature state '$state'"; failed=1 ;;
            esac
          done
          if [ "$failed" != "0" ]; then
            cat >&2 <<'EOF'

          A commit is unsigned, or its signature no longer matches its content.

          B means the object changed after it was signed -- most often an
          edited trailer or message. The Agent trailer is covered by the
          signature precisely so that this is visible.

          N means the machine is not signing. See docs/machine-setup.md
          section 2, then prove it took effect rather than assuming:

              git log -1 --format='%G?'      # expect G

          Anything else usually means the signing key is not listed in
          .github/allowed_signers. Add the machine's key there in the
          same PR that registers it on GitHub.
          EOF
            exit 1
          fi

  analyzer-drift:
    name: Analyzer drift (scheduled, unpinned)
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install the analyzer pool unpinned in a throwaway venv
        # Deliberately separate from the PR gates above. An unchanged
        # `main` going red because an analyzer shipped is still a useful
        # signal, but it belongs on the scheduled drift check rather
        # than on the merge gate that is meant to certify P1.
        run: |
          python3 -m venv /tmp/analyzer-drift
          /tmp/analyzer-drift/bin/python -m pip install --upgrade pip
          /tmp/analyzer-drift/bin/python -m pip install \
            cohesion complexipy flake8 interrogate lizard multimetric \
            mypy pydocstyle pylint radon ruff vulture
      - name: Fail visibly if the analyzer resolution drifted
        # Compared like with like. The first version diffed the raw
        # constraints file, which carries eight comment lines of
        # provenance, against `pip freeze` output, which carries none --
        # so the diff was non-empty on every run whether or not anything
        # had drifted. A check that can never pass is worth less than no
        # check: this file's own header says a pipeline that fails on
        # something advisory teaches people to ignore it.
        run: |
          strip() { grep -v '^#' "$1" | grep -v '^[[:space:]]*$' | sort -f; }
          /tmp/analyzer-drift/bin/python -m pip freeze --all \
            | grep -v '^pip==' > /tmp/analyzer-drift.raw
          strip constraints/analyzers.txt > /tmp/pinned.txt
          strip /tmp/analyzer-drift.raw > /tmp/resolved.txt
          diff -u /tmp/pinned.txt /tmp/resolved.txt

  audit:
    name: Audit (maintainability + security)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install the agents
        # This repo is the maintainability agent, so it audits itself
        # from source. The security agent comes from PyPI like any other
        # consumer would install it.
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -e ".[dev]"
          python3 -m pip install secure-code-agent
      - name: Install the pinned analyzer pool
        # The maintainability gate runs these analyzers in this job, so
        # the audit gate must use the same checked-in versions as verify.
        run: >
          python3 -m pip install
          --constraint constraints/analyzers.txt
          cohesion complexipy flake8 interrogate lizard multimetric
          mypy pydocstyle pylint radon ruff vulture

      # --- maintainability -------------------------------------------------
      # `--fail-on-gate` fails on hard-gate findings only. It does not read
      # the score or the letter grade, and it must not be changed to: doing
      # so would couple merges to evidence completeness, so a shallow CI
      # clone with no history would start blocking merges for having
      # nothing to measure rather than for anything being wrong.
      #
      # Adopting an existing repo with pre-existing failures? Add
      #   --baseline .maintainability-baseline.json
      # to gate only on *new* findings, and regenerate that baseline only
      # in a commit that does nothing else, so it is visible in review.
      - name: Maintainability audit
        id: maintainability
        run: |
          maintainability-agent \
            --config maintainability-agent.json \
            --fail-on-gate \
            --output maintainability-report.md \
            --prompt-output maintainability-remediation-prompt.md \
            --comment-output maintainability-pr-comment.md \
            --sarif-output maintainability.sarif

      # --- security --------------------------------------------------------
      - name: Security audit
        id: security
        if: always()
        run: |
          secure-code-agent \
            --fail-on-gate \
            --output secure-code-report.md \
            --prompt-output secure-code-remediation-prompt.md \
            --comment-output secure-code-pr-comment.md \
            --sarif-output secure-code.sarif

      # --- surface the findings where people look --------------------------
      - name: Upload maintainability SARIF
        uses: github/codeql-action/upload-sarif@42947a340483f03ba47bb1a039b2c519aab3df85 # v3
        if: always()
        with:
          sarif_file: maintainability.sarif
          category: maintainability-agent
      - name: Upload security SARIF
        uses: github/codeql-action/upload-sarif@42947a340483f03ba47bb1a039b2c519aab3df85 # v3
        if: always()
        with:
          sarif_file: secure-code.sarif
          category: secure-code-agent

      - name: Comment on the PR
        # One comment, updated in place. A new comment per push turns the
        # thread into noise and people stop reading it — which is the same
        # failure as a gate nobody trusts.
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- quality-gates -->';
            const read = (p) => fs.existsSync(p) ? fs.readFileSync(p, 'utf8') : `_${p} not produced — the audit step failed before writing it._`;
            const body = [
              marker,
              '## Quality gates',
              '',
              read('maintainability-pr-comment.md'),
              '',
              '---',
              '',
              read('secure-code-pr-comment.md'),
              '',
              '---',
              '',
              '**To fix:** download the `audit-artifacts` bundle from this run and hand',
              '`maintainability-remediation-prompt.md` or `secure-code-remediation-prompt.md`',
              'to your coding agent verbatim. Those prompts are bounded to the findings above.',
              'Do not ask an agent to "improve the code" instead — measured on six repositories,',
              'the unbounded instruction closed a median of zero findings and made two of them worse.',
            ].join('\n');
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const existing = (await github.rest.issues.listComments({ owner, repo, issue_number }))
              .data.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

      - name: Upload audit artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: audit-artifacts
          path: |
            maintainability-report.md
            maintainability-remediation-prompt.md
            maintainability-pr-comment.md
            maintainability.sarif
            secure-code-report.md
            secure-code-remediation-prompt.md
            secure-code-pr-comment.md
            secure-code.sarif
