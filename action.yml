name: Maintainability Agent
description: Run maintainability audit and generate AI remediation artifacts.
inputs:
  config:
    description: Path to maintainability config.
    required: false
    default: maintainability-audit.example.json
  changed-only:
    description: Optional git revspec for changed-only mode.
    required: false
    default: ""
  fail-on-gate:
    description: Fail on hard gates.
    required: false
    default: "true"
  record-history:
    description: >-
      Append this scan to .maintainability/history.jsonl so trends and
      recurrence can read it on later runs. Off by default — recording is a
      write into your workspace, and every write this tool performs is
      opt-in. Pair it with a cache restore/save of that file (see
      .github/workflows/maintainability.yml) or the history evaporates with
      the runner.
    required: false
    default: "false"
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: "3.11"
    - shell: bash
      run: python3 -m pip install -e "$GITHUB_ACTION_PATH"
    - shell: bash
      run: |
        args=(maintainability-agent --config "${{ inputs.config }}" --output maintainability-report.md --prompt-output maintainability-remediation-prompt.md --comment-output maintainability-pr-comment.md --sarif-output maintainability.sarif)
        if [ -n "${{ inputs.changed-only }}" ]; then
          args+=(--changed-only "${{ inputs.changed-only }}")
        fi
        if [ "${{ inputs.fail-on-gate }}" = "true" ]; then
          args+=(--fail-on-gate)
        fi
        if [ "${{ inputs.record-history }}" = "true" ]; then
          args+=(--record-history)
        fi
        "${args[@]}"
