[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "maintainability-agent"
# Derived from `maintainability_audit.__version__`, the only place the number
# is written. Duplicating it here is how a release stamps one version into the
# wheel and another into every report it produces — secure-code-agent shipped
# exactly that wheel before removing its copy (its release note for 0.5.0).
dynamic = ["version"]
description = "Maintainability gate and AI remediation prompt generator for CI."
readme = "README.md"
# 3.11, not 3.10. `_discovery`, `_pillars` and `_runner` all import
# `enum.StrEnum`, which landed in 3.11, so pip installed happily on
# 3.10 and the import then failed. Nothing in CI stood where the
# metadata said a user could stand: the suite runs 3.12 and the
# composite action pins 3.11 (D42).
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "Marshall Guillory" }
]
keywords = ["maintainability", "ci", "audit", "quality", "iso-25010", "ai-code-review"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  # POSIX because that is what has been demonstrated. CI runs Linux,
  # development runs macOS, and nothing has ever run on Windows: seven
  # test files create symlinks with no platform guard, and `os.symlink`
  # needs Developer Mode there. Claiming an untested platform is the
  # defect this project keeps finding in itself (D63).
  "Operating System :: POSIX",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Quality Assurance"
]

[project.scripts]
maintainability-audit = "maintainability_audit.cli:main"
maintainability-agent = "maintainability_audit.cli:main"
maintainability-agent-mcp = "maintainability_audit.mcp_server:main"

[project.optional-dependencies]
# `setuptools` is a test dependency, not just a build one: the two
# artifact-boundary tests stage a real distribution, and they are the
# only thing standing between this project and a repeat of D23 — nine
# releases that shipped with no analyzer catalog because the suite
# tested a source checkout instead of an artifact. They used to skip
# when the backend was absent, which is how they ran on no CI machine
# at all while reporting green. A lint now forbids them to skip, so the
# backend has to be declared where the tests can find it.
test = ["pytest>=8", "pytest-cov>=5", "jsonschema>=4", "setuptools>=70"]
mcp = ["mcp>=2,<3"]
# `lizard` is the independent complexity implementation
# `tools/complexity_oracle.py` diffs this project against. It is a
# development dependency, never a runtime one: nothing the product
# ships imports it, and the oracle exists so a measurement can be
# checked against something other than its author.
dev = ["pytest>=8", "pytest-cov>=5", "pytest-xdist>=3.6", "jsonschema>=4", "ruff>=0.5", "pip-audit>=2.7", "mcp>=2,<3", "PyYAML>=6", "setuptools>=70", "lizard>=1.17"]

[tool.pydocstyle]
# D401 ("First line should be in imperative mood") is switched off, and the
# reason is a product decision rather than a preference.
#
# It was 330 of this repository's 566 pydocstyle findings — the single most
# voluminous rule against it by a wide margin — and every one of them asks for
# the same edit: `"""Returns the score."""` to `"""Return the score."""`.
#
# The docstrings here are deliberately not in that voice. They are narrative,
# and most of them exist to carry a defect's reasoning where the code that
# caused it lives: "Why each axis sits outside the score", "The delegate's own
# remediation prompt - its work order". D401 wants a terse imperative opener,
# and complying would flatten the sentences this project uses to explain
# itself. That trades the thing being measured for the measurement.
#
# It is also style rather than maintainability: a docstring's mood says
# nothing about whether the code survives change, which is what the rest of
# this tool measures. Turned off here rather than suppressed per finding,
# because 330 acknowledgements with expiry dates would be a ritual, and
# because the decision is about the whole repository's voice rather than any
# one line.
#
# Every other pydocstyle rule stays on. Missing docstrings (D1xx), malformed
# summaries (D2xx) and bad quoting (D3xx) are all still reported, which is the
# conformance half `interrogate` does not measure.
add-ignore = "D401"

[tool.setuptools.dynamic]
# The single source of truth. `src/maintainability_audit/__init__.py` holds the
# literal; this reads it. The two cannot drift because there is only one.
version = { attr = "maintainability_audit.__version__" }

[tool.setuptools.package-data]
# `_assets` carries the runtime data the code cannot work without: the
# analyzer catalog and the rubric served over MCP. Both used to live at
# the repository root, outside every package, so neither reached a
# wheel — see test_wheel_contents.py, which builds the artifact and
# looks inside rather than trusting this line.
maintainability_audit = ["_skill_data/**/*", "_assets/*"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# An empty parameter set is skipped by default, and a skip reports green.
# That let the grammar checks go vacuous: delete every fixture and the
# tests parametrized over them collect nothing, skip, and pass — the
# falsifier gate caught it on the PR after they passed locally. Absence
# read as a pass is the defect this project keeps finding in itself, so
# it fails at collection instead (D121).
empty_parameter_set_mark = "fail_at_collect"
# addopts intentionally empty so the sandbox-friendly invocation
# (`PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 pytest -p no:cacheprovider`) does
# not choke on `--cov` flags whose plugin couldn't load. Coverage is
# opt-in: pass `--cov=maintainability_audit --cov-fail-under=92`
# explicitly (see CONTRIBUTING.md, docs/external-quality-tools.md,
# and the GH workflow).

[tool.coverage.run]
branch = true
source = ["maintainability_audit"]

[tool.coverage.report]
fail_under = 92
show_missing = true
skip_covered = false
exclude_also = [
  "if __name__ == .__main__.:",
  "raise SystemExit\\(main\\(\\)\\)"
]

[tool.coverage.xml]
output = "coverage.xml"

[tool.ruff]
line-length = 140
target-version = "py311"
# Grammar fixtures are specimens, not code. Each function in them exists
# to exercise one construct that language's specification defines, and
# the linter's advice is the opposite of the point: `SIM116` asks for a
# dictionary in place of the `elif` chain whose branch count is the thing
# under test. Every other fixture is in a language ruff cannot read, so
# Python's was the first to collide.
exclude = ["tests/fixtures/grammar"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
