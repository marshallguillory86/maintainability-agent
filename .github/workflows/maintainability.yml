name: Maintainability

on:
  pull_request:
  push:
    branches: [main, master]

jobs:
  maintainability:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # SonarQube Cloud needs full git history to compute new-code
          # metrics (lines added since main, blame attribution, etc.).
          # Shallow clone breaks the new-code gate.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Upgrade pip itself (fixes CVE-2026-6357 in pip 26.0.1)
        run: python3 -m pip install --upgrade pip
      - name: Install tool with dev extras
        run: python3 -m pip install -e ".[dev]"
      - name: Lint (ruff)
        run: ruff check src tests
      - name: Dependency CVE scan (pip-audit)
        # CVE-2026-3219 against pip has no upstream fix as of 2026-05-09.
        # When one ships, drop the --ignore-vuln. Tracked at
        # https://github.com/pypa/pip/security/advisories
        run: pip-audit --ignore-vuln CVE-2026-3219
      - name: Tests + coverage
        run: |
          python3 -m pytest \
            --cov=maintainability_audit \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --cov-fail-under=92
      - name: Run maintainability audit on this repo
        run: |
          maintainability-agent \
            --config maintainability-agent.json \
            --fail-on-gate \
            --output maintainability-report.md \
            --prompt-output maintainability-remediation-prompt.md \
            --comment-output maintainability-pr-comment.md \
            --sarif-output maintainability.sarif
      - name: SonarQube Cloud scan
        # Cross-validates the local maintainability audit against
        # SonarQube Cloud's analysis. Reads coverage from the
        # `coverage.xml` written by the test step above (see
        # `sonar-project.properties` for the project key + paths).
        # Requires `SONAR_TOKEN` in repo secrets (sonarcloud.io →
        # My Account → Security → generate token; GitHub repo →
        # Settings → Secrets → add).
        # SONAR_HOST_URL must point at SonarQube Cloud; the action's
        # default is a self-hosted server at localhost:9000.
        #
        # Advisory, not a gate. This project's rules are "no cloud
        # service requirement" and "no vendor lock-in" (CONTRIBUTING.md),
        # so an expired token or a moved SonarCloud project must not
        # block a PR whose deterministic checks all pass. The gates that
        # can fail this workflow are the steps above: ruff, pip-audit,
        # tests + coverage, and the tool's own --fail-on-gate audit.
        # A red mark here means "go look at the token", not "the code is
        # broken" — check the step log before assuming a regression.
        continue-on-error: true
        env:
          SONAR_TOKEN:    ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
          GITHUB_TOKEN:   ${{ secrets.GITHUB_TOKEN }}
        uses: SonarSource/sonarqube-scan-action@v2
      - name: Upload maintainability report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: maintainability-audit-artifacts
          path: |
            maintainability-report.md
            maintainability-remediation-prompt.md
            maintainability-pr-comment.md
            maintainability.sarif
            coverage.xml
