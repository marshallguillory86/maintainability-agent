name: Authorship

# Is every commit from the expected identity, and signed?
#
# Two checks in one required job, deliberately: the branch's
# required-checks list is keyed on the *job name*, so a new job name sits
# un-enforced until it is added to branch protection. Adding steps to a
# job already named in that list inherits enforcement on the day it
# merges.
#
# Split out of quality-gates.yml, which reached 624 lines and tripped this
# tool's own max_file_lines gate on its own repository. The split is by
# concern rather than by line count: correctness gates live there,
# provenance lives here.

on:
  pull_request:

permissions:
  contents: read

jobs:
  declared-authorship:
    name: Commit identity and signatures
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # The branch tip, not the default `refs/pull/N/merge`. On a
          # pull_request event the default checkout is a merge commit
          # GitHub builds for CI: authored by the PR author, committed by
          # `noreply@github.com`, signed by nobody. It has no key on the
          # allow-list to verify against, so the signature gate below read
          # it as `E` and failed the run on GitHub's own artifact.
          #
          # `--no-merges` used to hide this, and that was the wrong cure:
          # it also skipped the merges a developer actually makes, which
          # carry their conflict resolution. Checking out the real tip
          # removes the synthetic commit from history entirely, so those
          # merges can be checked without CI tripping over its own.
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Each commit carries the repository's commit identity
        # An allowlist, not a denylist: a commit passes only when its author
        # and committer are the one identity below. A global `~/.gitconfig`
        # value falls through silently whenever a repo-local override stops
        # applying, and once such a commit reaches a protected branch it is
        # not fixable without a force-push.
        #
        # Author *and* committer, because a rebase or an amend rewrites
        # one and not the other.
        run: |
          set -euo pipefail
          allowed="152444602+marshallguillory86@users.noreply.github.com"
          range="origin/${{ github.base_ref }}..HEAD"
          commits=$(git rev-list --no-merges "$range")
          if [ -z "$commits" ]; then
            echo "no non-merge commits in $range; this check proved nothing"
            exit 1
          fi
          failed=0
          for sha in $commits; do
            for role in author:%ae committer:%ce; do
              addr=$(git show -s --format="${role#*:}" "$sha")
              if [ "$addr" = "$allowed" ]; then
                echo "ok    $sha  ${role%%:*}: $addr"
              else
                echo "FAIL  $sha  ${role%%:*}: $addr"
                failed=1
              fi
            done
          done
          if [ "$failed" != "0" ]; then
            cat >&2 <<EOF

          Commit identity is not the repository's GitHub noreply address.

          Expected: $allowed

          Fix the machine, then rewrite the range -- a wrong address is
          not fixable after it reaches a protected branch without a
          force-push. See docs/machine-setup.md section 1.

              git config --global user.email "$allowed"
              git config --global user.name  "Marshall Guillory"
              git rebase --exec 'git commit --amend --no-edit --reset-author -S' \\
                  origin/${{ github.base_ref }}
          EOF
            exit 1
          fi
      - name: Each commit is signed
        # A signature is computed over the entire commit object -- tree,
        # parents, author, committer and the full message -- so any edit
        # to a commit after it was signed turns `%G?` to B.
        #
        # Verification runs against `.github/allowed_signers`, checked
        # into the repo, so the trusted set changes only by reviewed
        # pull request rather than by whatever sits on a runner.
        #
        # What this establishes: the commit was not altered after signing,
        # and a key on the allow-list stood behind it.
        run: |
          set -euo pipefail
          git config gpg.ssh.allowedSignersFile .github/allowed_signers
          range="origin/${{ github.base_ref }}..HEAD"
          # Signatures are checked over *every* commit, merges included,
          # while the range is still required to contain a non-merge commit.
          # The two are separate questions and were wrongly answered by one
          # `--no-merges`: a merge carries the conflict resolution its
          # author wrote, so an unsigned merge is unattested content, and
          # skipping it let exactly that through. Requiring a non-merge
          # commit stays, because a range of nothing but merges still
          # proves nothing about the work.
          commits=$(git rev-list "$range")
          if [ -z "$(git rev-list --no-merges "$range")" ]; then
            echo "no non-merge commits in $range; this check proved nothing"
            exit 1
          fi
          failed=0
          for sha in $commits; do
            state=$(git log -1 --format='%G?' "$sha")
            key=$(git log -1 --format='%GK' "$sha")
            case "$state" in
              G) echo "ok    $sha  signed by $key" ;;
              B) echo "FAIL  $sha  BAD signature -- the commit was altered after signing"; failed=1 ;;
              N) echo "FAIL  $sha  unsigned"; failed=1 ;;
              U|X|Y|R|E)
                 echo "FAIL  $sha  signature state '$state' (key not in .github/allowed_signers?)"
                 failed=1 ;;
              *) echo "FAIL  $sha  unknown signature state '$state'"; failed=1 ;;
            esac
          done
          if [ "$failed" != "0" ]; then
            cat >&2 <<'EOF'

          A commit is unsigned, or its signature no longer matches its content.

          B means the object changed after it was signed -- most often an
          edited message.

          N means the machine is not signing. See docs/machine-setup.md
          section 2, then prove it took effect rather than assuming:

              git log -1 --format='%G?'      # expect G

          Anything else usually means the signing key is not listed in
          .github/allowed_signers. Add the machine's key there in the
          same PR that registers it on GitHub.
          EOF
            exit 1
          fi
      - name: Commit messages name only the commit identity
        # The identity step checks author and committer, and a message can
        # still carry another address -- a `Co-authored-by:` trailer, most
        # often. Removing one after it reaches a protected branch takes a
        # history rewrite, so any address in a message other than the
        # repository's commit identity fails here, before the merge.
        run: |
          set -euo pipefail
          allowed="152444602+marshallguillory86@users.noreply.github.com"
          range="origin/${{ github.base_ref }}..HEAD"
          # Merges included, as in the signature step: a merge message is
          # typed like any other and can carry a trailer just the same.
          commits=$(git rev-list "$range")
          if [ -z "$(git rev-list --no-merges "$range")" ]; then
            echo "no non-merge commits in $range; this check proved nothing"
            exit 1
          fi
          failed=0
          for sha in $commits; do
            others=$(git show -s --format=%B "$sha" \
              | grep -o -E '[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}' \
              | grep -v -x -F "$allowed" || true)
            if [ -n "$others" ]; then
              echo "FAIL  $sha  message names an address other than the commit identity"
              failed=1
            else
              echo "ok    $sha"
            fi
          done
          exit $failed
      - name: No forbidden term in the change
        # Terms that must never appear in this repository live in the
        # FORBIDDEN_TERMS secret, one per line, so this check does not
        # publish what it guards. It reads each commit's identity fields and
        # message, and every line the change adds. It fails closed: without
        # the secret it proves nothing, and says so.
        #
        # Matches are reported by commit and file only, never by the text
        # that matched.
        env:
          FORBIDDEN_TERMS: ${{ secrets.FORBIDDEN_TERMS }}
        run: |
          set -euo pipefail
          range="origin/${{ github.base_ref }}..HEAD"
          commits=$(git rev-list "$range")
          if [ -z "$(git rev-list --no-merges "$range")" ]; then
            echo "no non-merge commits in $range; this check proved nothing"
            exit 1
          fi
          terms=$(mktemp)
          printf '%s\n' "${FORBIDDEN_TERMS:-}" | sed '/^[[:space:]]*$/d' > "$terms"
          if [ ! -s "$terms" ]; then
            echo "FORBIDDEN_TERMS is empty or unset; this check proved nothing"
            exit 1
          fi
          failed=0
          for sha in $commits; do
            if git show -s --format='%an%n%ae%n%cn%n%ce%n%B' "$sha" | grep -q -i -F -f "$terms"; then
              echo "FAIL  $sha  identity or message contains a forbidden term"
              failed=1
            fi
          done
          for path in $(git diff --name-only "origin/${{ github.base_ref }}...HEAD"); do
            if git diff "origin/${{ github.base_ref }}...HEAD" -- "$path" | grep '^+' | grep -q -i -F -f "$terms"; then
              echo "FAIL  $path  adds a forbidden term"
              failed=1
            fi
          done
          if [ "$failed" = "0" ]; then
            echo "ok    no forbidden term in $range"
          fi
          exit $failed
