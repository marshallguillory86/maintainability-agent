name: Release

# Publishes to PyPI when a version tag is pushed.
#
# Authentication is PyPI Trusted Publishing (OIDC): GitHub mints a
# short-lived token for this specific workflow in this specific
# repository, and PyPI verifies it. There is no API token in repository
# secrets, so there is nothing to leak and nothing to rotate — which is
# what broke the SonarQube scan for three months.
#
# One-time setup on PyPI (https://pypi.org/manage/project/maintainability-agent/settings/publishing/):
#   Owner:            marshallguillory86
#   Repository name:  maintainability-agent
#   Workflow name:    release.yml
#   Environment name: pypi
#
# Release process after that:
#   1. bump the version in pyproject.toml + __init__.py + config.py
#   2. add the CHANGELOG entry, merge to main
#   3. git tag -a vX.Y.Z -m "..." && git push origin vX.Y.Z
#
# `workflow_dispatch` publishes whatever version is on the chosen ref,
# for the first run or to recover a failed publish.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install build tooling
        run: python3 -m pip install --upgrade build twine

      # A tag that disagrees with the packaged version publishes the
      # wrong thing under the right name, and PyPI uploads cannot be
      # replaced. Fail before building rather than after uploading.
      - name: Verify the tag matches the packaged version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          packaged=$(python3 -c "import tomllib,pathlib; print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")
          echo "tag=$tag packaged=$packaged"
          if [ "$tag" != "$packaged" ]; then
            echo "::error::Tag v$tag does not match pyproject version $packaged"
            exit 1
          fi

      # The package's own claims should hold for the artifact being
      # shipped, not just for the working tree.
      - name: Test the built package
        run: |
          set -euo pipefail
          python3 -m build
          python3 -m twine check dist/*
          python3 -m pip install dist/*.whl
          maintainability-agent --version
          python3 -m pip install ".[dev]"
          PYTHONPATH=src python3 -m pytest -q
          maintainability-agent --root . --config maintainability-agent.json --fail-on-gate --output /dev/null

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: distributions
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    # Named environment so PyPI can scope the trusted publisher to it,
    # and so a required reviewer can be added later without touching
    # this file.
    environment:
      name: pypi
      url: https://pypi.org/p/maintainability-agent
    permissions:
      id-token: write # mints the OIDC token; no secrets involved
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
