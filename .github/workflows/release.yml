name: Release

# Publishes to PyPI when a version tag is pushed.
#
# Authentication is PyPI Trusted Publishing (OIDC): GitHub mints a
# short-lived token for this specific workflow in this specific
# repository, and PyPI verifies it. There is no API token in repository
# secrets, so there is nothing to leak and nothing to rotate — which is
# what broke the SonarQube scan for three months.
#
# One-time setup on PyPI (https://pypi.org/manage/project/maintainability-agent/settings/publishing/):
#   Owner:            marshallguillory86
#   Repository name:  maintainability-agent
#   Workflow name:    release.yml
#   Environment name: pypi
#
# Release process after that — tagging is the only manual step:
#   1. bump the version in ONE place: `src/maintainability_audit/__init__.py`.
#      `pyproject.toml` derives it through `[tool.setuptools.dynamic]` and
#      `config.VERSION` re-exports it (D198). Writing it into either of
#      those again fails `test_the_version_has_one_source`.
#   2. run `python3 tools/stamp_version.py`, which writes the README's
#      version line, the README's Action pin, the `docs/release-plan.md`
#      row and the SECURITY.md support table from that one literal, and
#      exits non-zero if any of them stopped matching (D200). The release
#      plan's row must already say vX.Y.Z in THIS commit, because
#      `test_the_release_plan_table_is_measured_not_remembered` compares it
#      against `git tag` and the tag is cut from here — skipping it passes
#      on main and fails the release build after the tag exists, which is
#      where v2.11.0 lost a build (D124). The stamp tool is what makes that
#      step impossible to forget; it is not optional.
#   3. add the CHANGELOG entry (## X.Y.Z). The GitHub Release job reads its
#      notes from that section, and `test_the_changelog_covers_the_shipping_version`
#      fails without it rather than letting the job substitute a placeholder
#      (D204).
#   4. merge to main
#   5. git tag -a vX.Y.Z -m "..." && git push origin vX.Y.Z
#
# Steps 1-3 are all checked by the ordinary suite, which the build job below
# re-runs against the installed wheel. Following this list by hand and
# getting it wrong is a red build, not a bad release.
#
# Pushing the tag runs three jobs: build+verify the artifact, publish it
# to PyPI, and cut the GitHub Release with notes read from the CHANGELOG
# section for that version. All three are idempotent — a re-pushed or
# re-pointed tag re-runs cleanly (PyPI skips an existing version, the
# GitHub Release is updated rather than duplicated) instead of going red.
#
# `workflow_dispatch` builds and publishes whatever version is on the
# chosen ref (the GitHub-Release job is tag-only), for the first run or
# to recover a failed publish.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Full history, tags included. This job runs the suite, and
          # `test_the_previous_release_was_tagged` reads tags; a shallow
          # checkout has none, and that test fails rather than pass on
          # nothing. Every job in quality-gates.yml already does this.
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install build tooling
        run: python3 -m pip install --upgrade build twine

      # A tag that disagrees with the packaged version publishes the
      # wrong thing under the right name, and PyPI uploads cannot be
      # replaced. Fail before building rather than after uploading.
      - name: Verify the tag matches the packaged version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          # Read the single source, not `pyproject`, which derives the
          # version rather than stating it (D198).
          #
          # This reads the *source literal*, before anything is built. It
          # is a cheap gate that fails in seconds rather than after an
          # upload PyPI will not let anyone replace. It is NOT a check on
          # the artifact: this comment used to claim it checked "the
          # literal the wheel will actually carry", which is the one thing
          # reading a file in the tree cannot do (D205). The wheel is
          # compared to the tag in the build step below, after it exists.
          source=$(python3 -c "import pathlib,re; print(re.search(r'__version__ = \"([^\"]+)\"', pathlib.Path('src/maintainability_audit/__init__.py').read_text()).group(1))")
          echo "tag=$tag source=$source"
          if [ "$tag" != "$source" ]; then
            echo "::error::Tag v$tag does not match the packaged version $source"
            exit 1
          fi

      # "No release until the known-defect ledger is empty" was a rule
      # nothing enforced. v3.1.0 was tagged at 17:13 with a defect that
      # had been reported twice in wrap-ups and never filed, so the
      # register read zero and the release went out; the entry (D148)
      # was written three hours later (D151).
      #
      # **Unconditional, and the first cut was not.** It ran only for a
      # tag ref, so `workflow_dispatch` — which this file documents as
      # the way to publish a chosen ref — walked straight past it. A
      # gate on one of two publishing paths is not a gate.
      #
      # What it cannot do, said precisely rather than flatteringly: it
      # does not "refuse a tag". Pushing a tag creates it, and this
      # workflow runs afterwards. It refuses the *publish*, which is
      # what matters, and leaves a tag that has to be moved or deleted.
      # Nor can it see a defect nobody wrote down — that is the
      # corollary about filing in the same turn, which no check reaches.
      # The bar is `product-intent.md`'s: no open High and no open
      # Medium. A Low may stand open through a release when the entry
      # records why it is not worth holding a version for, which keeps
      # that a visible decision rather than an assumed one.
      #
      # Severity is read off the heading, where every entry already
      # carries it: `### D<n> — Open: <summary> (High)`. An open entry
      # with no severity at all is refused too — an unclassified defect
      # is one nobody has decided about, and this gate exists precisely
      # so that decision cannot be skipped.
      - name: Refuse to publish with an open High or Medium
        run: |
          set -euo pipefail
          open=$(grep -E '^### D[0-9]+ — Open' docs/defect-register-chat-surface.md || true)
          blocking=$(printf '%s\n' "$open" | grep -vE '\((Low|Informational)\)\s*$' | grep -E '^### D' || true)
          lows=$(printf '%s\n' "$open" | grep -cE '\((Low|Informational)\)\s*$' || true)
          echo "open entries: $(printf '%s\n' "$open" | grep -cE '^### D' || true)  (low/informational, not blocking: $lows)"
          if [ -n "$blocking" ]; then
            echo "::error::open High/Medium entries in docs/defect-register-chat-surface.md; the release bar is no open High and no open Medium"
            printf '%s\n' "$blocking"
            exit 1
          fi

      # The package's own claims should hold for the artifact being
      # shipped, not just for the working tree.
      - name: Test the built package
        run: |
          set -euo pipefail
          python3 -m build
          python3 -m twine check dist/*
          python3 -m pip install dist/*.whl
          # The artifact's own version, not the tree's. The pre-build gate
          # above reads a file; this reads what a user will `pip install`,
          # which is the only thing a PyPI upload actually puts under that
          # name. The sibling project shipped a wheel stamped with one
          # version while every report it produced carried another, and
          # nothing on either side could see it (D205).
          #
          # Printed as well as compared, because a version that disagrees
          # should say both numbers in the log rather than only fail.
          built=$(python3 -c "from importlib.metadata import version; print(version('maintainability-agent'))")
          echo "built wheel reports version $built"
          maintainability-agent --version
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ] && [ "$built" != "${GITHUB_REF_NAME#v}" ]; then
            echo "::error::The built wheel carries $built, but the tag is $GITHUB_REF_NAME"
            exit 1
          fi
          python3 -m pip install ".[dev]"
          # Every audit runs secure-code-agent (D177), and it is installed
          # alongside rather than as a dependency. 3.7.2's tag failed here
          # because this job never installed it.
          python3 -m pip install 'secure-code-agent==0.12.8'
          PYTHONPATH=src python3 -m pytest -q
          # A real file inside the tree, not /dev/null: the D34 safe-write
          # hardening refuses a non-regular-file target *and* any path outside
          # the audited root, so the old /dev/null smoke test crashed the built
          # package on every tag. `maintainability-report.md` sits at the root
          # and is already in this repo's exclude_patterns.
          maintainability-agent --root . --config maintainability-agent.json --fail-on-gate --output maintainability-report.md

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: distributions
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    # Named environment so PyPI can scope the trusted publisher to it,
    # and so a required reviewer can be added later without touching
    # this file.
    environment:
      name: pypi
      url: https://pypi.org/p/maintainability-agent
    permissions:
      id-token: write # mints the OIDC token; no secrets involved
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          # Idempotent publish: a re-triggered or re-pointed tag must not
          # hard-fail with "400 File already exists" on a version PyPI
          # already has. A duplicate becomes a no-op instead of a red run.
          skip-existing: true

  github-release:
    name: GitHub Release
    needs: [build, publish]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write # create or update the Release object for this tag
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Publish the GitHub Release from the changelog
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          # Notes are the CHANGELOG section for this version — one source of
          # truth, extracted with awk so there is no heredoc to mis-indent.
          awk -v v="$version" '
            /^## / { if (p) exit; if ($0 ~ "^## " v) { p = 1; next } }
            p { print }
          ' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "Release $version." > notes.md
          # Idempotent: create the release, or refresh its notes if a re-run
          # finds it already there. Never a second failing path.
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --notes-file notes.md --latest
          else
            gh release create "$TAG" --title "$TAG" --notes-file notes.md --latest --verify-tag
          fi
