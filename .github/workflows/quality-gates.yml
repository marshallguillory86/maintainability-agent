name: Quality Gates

# Two jobs, both required for merge to main:
#
#   verify — correctness. Lint, dependency CVEs, tests, coverage.
#   audit  — the two deterministic agents, plus their remediation prompts.
#
# The design constraint is "no nit loops". Only **hard gates** can fail a
# build: file/function/duplication failures for maintainability, tripped
# security gates for secure-code. Warnings, letter grades, scores and the
# SonarQube cross-check are advisory — they inform review, they never
# block a merge. A pipeline that fails on a warning teaches people to
# ignore it, and then it protects nothing.
#
# Findings do not die in a log. They go three places a human actually
# looks: the Security tab (SARIF), a single updated PR comment, and a
# bounded remediation prompt artifact you can hand straight to an agent.

on:
  pull_request:
  # Every branch, not just the default one. An audit observed that a
  # pushed feature branch with no open PR ran no checks at all, so the
  # tool's own gate went unenforced on exactly the commits under review.
  push:
  # History-derived signals — churn hotspots, change coupling, ownership
  # concentration — cannot be computed from a diff. They need a window of
  # commits, so a repository that only ever audits changed files never
  # exercises a third of the rubric. This run is the one that does.
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write   # SARIF -> code scanning
  pull-requests: write     # the single updated PR comment

env:
  PYTHON_VERSION: "3.12"

jobs:
  verify:
    name: Verify (lint, deps, tests, coverage)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # SonarQube Cloud needs full history for new-code metrics, and
          # the maintainability audit needs it for the history aspects.
          # At the default depth of 1 those are unmeasured, which costs
          # roughly a grade and withholds a verified grade entirely.
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Upgrade pip itself (fixes CVE-2026-6357 in pip 26.0.1)
        run: python3 -m pip install --upgrade pip
      - name: Install tool with dev extras
        run: python3 -m pip install -e ".[dev]"
      - name: Install the pip-installable analyzer pool
        # Deliberately NOT a dev extra. ADR 006 makes analyzers runtime
        # prerequisites the user supplies, never package dependencies,
        # so CI supplies them the same way a user would -- installed
        # into the environment, discovered on PATH.
        #
        # Without this the adapters ship unexercised: 44 of the suite's
        # skips were "<tool> is not installed", so the 15 hand-written
        # adapters were covered only by their unit tests and never by an
        # actual invocation.
        #
        # Unpinned on purpose. An unchanged main going red because an
        # analyzer shipped a new version is the signal D48 was filed
        # from, and it is worth more than a quiet pin.
        run: >
          python3 -m pip install
          cohesion complexipy flake8 interrogate lizard multimetric
          mypy pydocstyle pylint radon vulture
      - name: Lint (ruff)
        run: ruff check src tests tools
      - name: Dependency CVE scan (pip-audit)
        # CVE-2026-3219 against pip has no upstream fix as of 2026-05-09.
        # When one ships, drop the --ignore-vuln. Tracked at
        # https://github.com/pypa/pip/security/advisories
        run: pip-audit --ignore-vuln CVE-2026-3219
      - name: Tests + coverage
        run: |
          python3 -m pytest \
            --cov=maintainability_audit \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --cov-fail-under=92
      - name: Upload coverage
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: coverage
          path: coverage.xml
      - name: SonarQube Cloud scan
        # Advisory cross-check, never a gate. This project's rules are "no
        # cloud service requirement" and "no vendor lock-in", so an expired
        # token or a moved project must not block a PR whose deterministic
        # checks all pass. A red mark here means "go look at the token".
        #
        # This comment used to read "main only, because the plan on this
        # private project covers the main branch alone". Both halves were
        # false. The repository is public and has been since 2026-05-09,
        # and SonarCloud is free and unlimited for public projects,
        # pull request analysis included.
        #
        # The symptom was real: "Not analyzed", and a quality gate the
        # app built from no data. The cause was that SonarCloud's main
        # branch was named `master`, which has never existed here, while
        # `main` sat alongside it as a *short-lived* branch merging into
        # it. So every scan of the real default branch was filed as a
        # feature branch off a main branch that had never been analyzed,
        # leaving pull requests with no baseline to diff against.
        #
        # Renamed 2026-08-26. Runs on pull requests again, where a
        # cross-check is worth something — still advisory, still
        # `continue-on-error`, because this project's rules are "no cloud
        # service requirement" and "no vendor lock-in": an expired token
        # must never block a PR whose deterministic checks all pass.
        continue-on-error: true
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8

  # `pyproject` declares `Operating System :: POSIX`, and until this job
  # existed the only evidence behind that claim was one Linux image. An
  # audit put it plainly: the platform test forbade `windows` in
  # `runs-on` and called that a demonstration, so macOS was claimed and
  # never once run (D63, reopened).
  #
  # Tests only. Coverage thresholds, pip-audit and Sonar are properties
  # of the project rather than of the platform, and running them twice
  # buys nothing but a second thing to keep green. What this job answers
  # is the one question the Linux runner cannot: does the product work
  # on the other POSIX this package claims.
  verify-macos:
    name: Verify on macOS (tests)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Upgrade pip itself (fixes CVE-2026-6357 in pip 26.0.1)
        run: python3 -m pip install --upgrade pip
      - name: Install tool with dev extras
        run: python3 -m pip install -e ".[dev]"
      - name: Tests
        run: python3 -m pytest -q

  audit:
    name: Audit (maintainability + security)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install the agents
        # This repo is the maintainability agent, so it audits itself
        # from source. The security agent comes from PyPI like any other
        # consumer would install it.
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -e ".[dev]"
          python3 -m pip install secure-code-agent

      # --- maintainability -------------------------------------------------
      # `--fail-on-gate` fails on hard-gate findings only. It does not read
      # the score or the letter grade, and it must not be changed to: doing
      # so would couple merges to evidence completeness, so a shallow CI
      # clone with no history would start blocking merges for having
      # nothing to measure rather than for anything being wrong.
      #
      # Adopting an existing repo with pre-existing failures? Add
      #   --baseline .maintainability-baseline.json
      # to gate only on *new* findings, and regenerate that baseline only
      # in a commit that does nothing else, so it is visible in review.
      - name: Maintainability audit
        id: maintainability
        run: |
          maintainability-agent \
            --config maintainability-agent.json \
            --fail-on-gate \
            --output maintainability-report.md \
            --prompt-output maintainability-remediation-prompt.md \
            --comment-output maintainability-pr-comment.md \
            --sarif-output maintainability.sarif

      # --- security --------------------------------------------------------
      - name: Security audit
        id: security
        if: always()
        run: |
          secure-code-agent \
            --fail-on-gate \
            --output secure-code-report.md \
            --prompt-output secure-code-remediation-prompt.md \
            --comment-output secure-code-pr-comment.md \
            --sarif-output secure-code.sarif

      # --- surface the findings where people look --------------------------
      - name: Upload maintainability SARIF
        uses: github/codeql-action/upload-sarif@42947a340483f03ba47bb1a039b2c519aab3df85 # v3
        if: always()
        with:
          sarif_file: maintainability.sarif
          category: maintainability-agent
      - name: Upload security SARIF
        uses: github/codeql-action/upload-sarif@42947a340483f03ba47bb1a039b2c519aab3df85 # v3
        if: always()
        with:
          sarif_file: secure-code.sarif
          category: secure-code-agent

      - name: Comment on the PR
        # One comment, updated in place. A new comment per push turns the
        # thread into noise and people stop reading it — which is the same
        # failure as a gate nobody trusts.
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- quality-gates -->';
            const read = (p) => fs.existsSync(p) ? fs.readFileSync(p, 'utf8') : `_${p} not produced — the audit step failed before writing it._`;
            const body = [
              marker,
              '## Quality gates',
              '',
              read('maintainability-pr-comment.md'),
              '',
              '---',
              '',
              read('secure-code-pr-comment.md'),
              '',
              '---',
              '',
              '**To fix:** download the `audit-artifacts` bundle from this run and hand',
              '`maintainability-remediation-prompt.md` or `secure-code-remediation-prompt.md`',
              'to your coding agent verbatim. Those prompts are bounded to the findings above.',
              'Do not ask an agent to "improve the code" instead — measured on six repositories,',
              'the unbounded instruction closed a median of zero findings and made two of them worse.',
            ].join('\n');
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const existing = (await github.rest.issues.listComments({ owner, repo, issue_number }))
              .data.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

      - name: Upload audit artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: audit-artifacts
          path: |
            maintainability-report.md
            maintainability-remediation-prompt.md
            maintainability-pr-comment.md
            maintainability.sarif
            secure-code-report.md
            secure-code-remediation-prompt.md
            secure-code-pr-comment.md
            secure-code.sarif
