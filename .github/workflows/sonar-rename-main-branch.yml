name: Sonar — rename main branch

# One-off maintenance, run by hand and then deleted.
#
# The SonarCloud project's main branch is named `master`, which does not
# exist in this repository and never has -- the default branch is `main`.
# So every analysis of `main` was filed as a non-main branch, the
# configured main branch was never analyzed, and pull request analysis
# had no baseline to compare against. That produced "Not analyzed" plus
# a quality gate built from no data, which is why the scan in
# quality-gates.yml is restricted to main-only pushes.
#
# The workflow exists rather than a local curl so SONAR_TOKEN stays in
# GitHub. Delete this file once the rename has been confirmed.

on:
  # `workflow_dispatch` only works for workflows already on the default
  # branch, and this one is deliberately never going to reach it. So it
  # fires on its own file changing, which happens exactly twice: when it
  # is added, and when it is deleted.
  push:
    paths:
      - ".github/workflows/sonar-rename-main-branch.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - name: Show which branch Sonar thinks is main
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          curl -sS -u "$SONAR_TOKEN:" \
            "https://sonarcloud.io/api/project_branches/list?project=marshallguillory86_maintainability-agent" \
            | python3 -c "import json,sys; [print(b['name'], 'isMain=' + str(b['isMain']), b['type']) for b in json.load(sys.stdin)['branches'] if b['isMain'] or b['name'] in ('main','master')]"

      - name: Delete the misfiled short-lived main
        # `main` already exists here as a SHORT branch merging into
        # `master`, which is why a straight rename returns 400. It holds
        # no analysis worth keeping -- every scan of the real default
        # branch was filed under it as a feature branch -- and the next
        # scan recreates it correctly as the main branch.
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          code=$(curl -sS -o /tmp/del.txt -w '%{http_code}' -X POST -u "$SONAR_TOKEN:" \
            "https://sonarcloud.io/api/project_branches/delete" \
            -d "project=marshallguillory86_maintainability-agent" \
            -d "branch=main")
          echo "HTTP $code"; cat /tmp/del.txt; echo
          [ "$code" = "204" ] || [ "$code" = "200" ]

      - name: Rename master to main
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          code=$(curl -sS -o /tmp/out.txt -w '%{http_code}' -X POST -u "$SONAR_TOKEN:" \
            "https://sonarcloud.io/api/project_branches/rename" \
            -d "project=marshallguillory86_maintainability-agent" \
            -d "name=main")
          echo "HTTP $code"; cat /tmp/out.txt; echo
          [ "$code" = "204" ] || [ "$code" = "200" ]

      - name: Confirm main is now the main branch
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          curl -sS -u "$SONAR_TOKEN:" \
            "https://sonarcloud.io/api/project_branches/list?project=marshallguillory86_maintainability-agent" \
            > /tmp/branches.json
          python3 - <<'PY'
          import json
          branches = json.load(open("/tmp/branches.json"))["branches"]
          main = [b for b in branches if b["isMain"]]
          print("main branch is now:", [b["name"] for b in main])
          assert len(main) == 1 and main[0]["name"] == "main", main
          PY
