[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "maintainability-agent"
version = "1.8.2"
description = "Maintainability gate and AI remediation prompt generator for CI."
readme = "README.md"
# 3.11, not 3.10. `_discovery`, `_pillars` and `_runner` all import
# `enum.StrEnum`, which landed in 3.11, so pip installed happily on
# 3.10 and the import then failed. Nothing in CI stood where the
# metadata said a user could stand: the suite runs 3.12 and the
# composite action pins 3.11 (D42).
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "Marshall Guillory" }
]
keywords = ["maintainability", "ci", "audit", "quality", "iso-25010", "ai-code-review"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  # POSIX because that is what has been demonstrated. CI runs Linux,
  # development runs macOS, and nothing has ever run on Windows: seven
  # test files create symlinks with no platform guard, and `os.symlink`
  # needs Developer Mode there. Claiming an untested platform is the
  # defect this project keeps finding in itself (D63).
  "Operating System :: POSIX",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Quality Assurance"
]

[project.scripts]
maintainability-audit = "maintainability_audit.cli:main"
maintainability-agent = "maintainability_audit.cli:main"
maintainability-agent-mcp = "maintainability_audit.mcp_server:main"

[project.optional-dependencies]
# `setuptools` is a test dependency, not just a build one: the two
# artifact-boundary tests stage a real distribution, and they are the
# only thing standing between this project and a repeat of D23 — nine
# releases that shipped with no analyzer catalog because the suite
# tested a source checkout instead of an artifact. They used to skip
# when the backend was absent, which is how they ran on no CI machine
# at all while reporting green. A lint now forbids them to skip, so the
# backend has to be declared where the tests can find it.
test = ["pytest>=8", "pytest-cov>=5", "jsonschema>=4", "setuptools>=70"]
mcp = ["mcp>=2,<3"]
dev = ["pytest>=8", "pytest-cov>=5", "jsonschema>=4", "ruff>=0.5", "pip-audit>=2.7", "mcp>=2,<3", "PyYAML>=6", "setuptools>=70"]

[tool.setuptools.package-data]
# `_assets` carries the runtime data the code cannot work without: the
# analyzer catalog and the rubric served over MCP. Both used to live at
# the repository root, outside every package, so neither reached a
# wheel — see test_wheel_contents.py, which builds the artifact and
# looks inside rather than trusting this line.
maintainability_audit = ["_skill_data/**/*", "_assets/*"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# addopts intentionally empty so the sandbox-friendly invocation
# (`PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 pytest -p no:cacheprovider`) does
# not choke on `--cov` flags whose plugin couldn't load. Coverage is
# opt-in: pass `--cov=maintainability_audit --cov-fail-under=92`
# explicitly (see CONTRIBUTING.md, docs/external-quality-tools.md,
# and the GH workflow).

[tool.coverage.run]
branch = true
source = ["maintainability_audit"]

[tool.coverage.report]
fail_under = 92
show_missing = true
skip_covered = false
exclude_also = [
  "if __name__ == .__main__.:",
  "raise SystemExit\\(main\\(\\)\\)"
]

[tool.coverage.xml]
output = "coverage.xml"

[tool.ruff]
line-length = 140
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
